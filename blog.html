<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Ankit Mishra</title>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <style>
    :root {
      --bg: #fdfdfc;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --faint: #9a9a96;
      --line: #e5e5e3;
      --card: #f7f7f5;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, .08);
    }

    html[data-theme="dark"] {
      --bg: #0e0e0e;
      --fg: #eaeaea;
      --muted: #9a9a97;
      --faint: #6e6e6b;
      --line: #262624;
      --card: #171716;
      --accent: #6a97f0;
      --accent-soft: rgba(106, 151, 240, .12);
    }

    * { box-sizing: border-box; }

    html {
      color-scheme: light dark;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      font-feature-settings: 'ss01' on, 'cv01' on;
      -webkit-font-smoothing: antialiased;
      transition: background .25s ease, color .25s ease;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 56px 28px 140px;
    }

    /* ---------- Top bar ---------- */
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 64px;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color .15s ease;
    }

    .back-link:hover { color: var(--fg); }

    .back-link svg { width: 14px; height: 14px; }

    #theme-toggle {
      position: relative;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--fg);
      border-radius: 10px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #theme-toggle svg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      transition: opacity .2s ease;
    }

    #theme-toggle .sun { opacity: 0; }
    html[data-theme="dark"] #theme-toggle .moon { opacity: 0; }
    html[data-theme="dark"] #theme-toggle .sun { opacity: 1; }

    /* ---------- Header ---------- */
    .post-date {
      color: var(--faint);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1.post-title {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.18;
      margin: 0 0 20px;
    }

    .post-desc {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
      margin-bottom: 56px;
    }

    /* ---------- Article typography ---------- */
    article {
      border-top: 1px solid var(--line);
      padding-top: 48px;
      font-size: 18px;
      line-height: 1.8;
      color: var(--fg);
    }

    article > *:first-child { margin-top: 0; }

    article h2 {
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -.01em;
      line-height: 1.3;
      margin: 56px 0 18px;
    }

    article h3 {
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -.005em;
      margin: 40px 0 14px;
    }

    article p {
      margin: 0 0 26px;
    }

    article ul, article ol {
      margin: 0 0 26px;
      padding-left: 24px;
    }

    article li {
      margin-bottom: 12px;
      padding-left: 4px;
    }

    article li:last-child { margin-bottom: 0; }

    article li > p { margin-bottom: 12px; }

    article strong { font-weight: 650; }

    article a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: var(--accent-soft);
      text-underline-offset: 3px;
      transition: text-decoration-color .15s ease;
    }

    article a:hover { text-decoration-color: var(--accent); }

    article code {
      background: var(--accent-soft);
      padding: 2.5px 7px;
      border-radius: 5px;
      font-size: 15px;
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    }

    article pre {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px 22px;
      overflow-x: auto;
      margin: 8px 0 30px;
    }

    article pre code {
      background: none;
      padding: 0;
      font-size: 14.5px;
      line-height: 1.65;
    }

    article blockquote {
      margin: 0 0 28px;
      padding-left: 20px;
      border-left: 3px solid var(--line);
      color: var(--muted);
      font-style: italic;
    }

    article blockquote p { margin-bottom: 10px; }
    article blockquote p:last-child { margin-bottom: 0; }

    article hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 44px 0;
    }

    article img {
      max-width: 100%;
      border-radius: 10px;
      margin: 8px 0 30px;
    }

    .state-msg {
      color: var(--muted);
      padding: 40px 0;
    }

    @media (max-width: 480px) {
      .wrap { padding: 40px 22px 100px; }
      h1.post-title { font-size: 30px; }
      .post-desc { font-size: 16.5px; margin-bottom: 44px; }
      article { font-size: 16.5px; }
      article h2 { font-size: 21px; margin: 44px 0 14px; }
      article h3 { font-size: 17.5px; }
    }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <div class="wrap">
    <div class="top-row">
      <a class="back-link" href="index.html#blog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
        Back to blog
      </a>
      <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
      </button>
    </div>

    <div id="post-header"></div>
    <article id="post-body">
      <p class="state-msg">Loading…</p>
    </article>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script>
    /* ---------- Theme toggle ---------- */
    var root = document.documentElement;
    var themeBtn = document.getElementById('theme-toggle');
    themeBtn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) { }
    });

    /* ---------- Post metadata ----------
       Keep this in sync with the `posts` array in index.html —
       it supplies the title/date/description shown above the
       article, while the actual writing lives in {slug}.md. */
    const posts = {
      "understanding-sql-indexes": {
        title: "Understanding SQL Indexes",
        desc: "What indexes are, how B-trees make them fast, and when NOT to add one",
        date: "2026-09-12"
      }
    };

    /* ---------- Render ---------- */
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('post');
    const headerEl = document.getElementById('post-header');
    const bodyEl = document.getElementById('post-body');

    function showNotFound() {
      headerEl.innerHTML = '<h1 class="post-title">Post not found</h1>';
      bodyEl.innerHTML = '<p class="state-msg">Couldn\'t find that post. <a href="index.html#blog">Back to the blog list</a>.</p>';
    }

    if (!slug || !posts[slug]) {
      showNotFound();
    } else {
      const meta = posts[slug];
      headerEl.innerHTML = `
        <div class="post-date">${new Date(meta.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
        <h1 class="post-title">${meta.title}</h1>
        <div class="post-desc">${meta.desc}</div>
      `;
      document.title = meta.title + ' — Ankit Mishra';

      fetch(`${slug}.md`)
        .then(res => {
          if (!res.ok) throw new Error('not found');
          return res.text();
        })
        .then(md => {
          bodyEl.innerHTML = marked.parse(md);
        })
        .catch(() => {
          bodyEl.innerHTML = '<p class="state-msg">Couldn\'t load this post right now. Try again shortly.</p>';
        });
    }
  </script>
</body>

</html>
