<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogs</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Fira+Code:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #fdfdfc;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --faint: #9a9a96;
      --fainter: #c2c2be;
      --line: #e5e5e3;
      --card: #f7f7f5;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, .08);
      --heading: "Lora", Georgia, serif;
      --body: "IBM Plex Sans", "Inter", sans-serif;
      --mono: "Fira Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    html[data-theme="dark"] {
      --bg: #0e0e0e;
      --fg: #eaeaea;
      --muted: #9a9a97;
      --faint: #6e6e6b;
      --fainter: #4c4c49;
      --line: #262624;
      --card: #171716;
      --accent: #6a97f0;
      --accent-soft: rgba(106, 151, 240, .12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light dark;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-feature-settings: 'ss01' on, 'cv01' on;
      -webkit-font-smoothing: antialiased;
      transition: background .25s ease, color .25s ease;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 56px 24px 140px;
    }

    /* ---------- Top bar ---------- */
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 64px;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color .15s ease;
    }

    .back-link:hover {
      color: var(--fg);
    }

    .back-link svg {
      width: 14px;
      height: 14px;
    }

    #theme-toggle {
      position: relative;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--fg);
      border-radius: 10px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #theme-toggle svg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      transition: opacity .2s ease;
    }

    #theme-toggle .sun {
      opacity: 0;
    }

    html[data-theme="dark"] #theme-toggle .moon {
      opacity: 0;
    }

    html[data-theme="dark"] #theme-toggle .sun {
      opacity: 1;
    }

    /* ---------- Header ---------- */
    /* Mono, uppercase, tracked-out — the same label treatment the
       portfolio uses for its section headers, so a post reads as a
       continuation of the site rather than a separate template. */
    .post-date {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    /* Lora renders with a noticeably shorter x-height than the sans
       faces around it, so the title needs a few extra px and the full
       700 weight to hold its own as the page's largest text. */
    h1.post-title {
      font-family: var(--heading);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.006em;
      line-height: 1.28;
      margin: 0 0 14px;
      text-wrap: balance;
    }

    .post-desc {
      color: var(--muted);
      font-family: var(--body);
      font-weight: 400;
      font-size: 16.5px;
      line-height: 1.6;
      margin-bottom: 44px;
      text-wrap: pretty;
    }

    /* ---------- Article typography ----------
       IBM Plex Sans for the running text — it optically reads a touch
       larger than a serif at the same size, so the body size comes down
       slightly from what a serif setting would use, with extra leading
       to keep long paragraphs comfortable. Lora carries the headings for
       a bit of editorial contrast against all that sans. */
    article {
      border-top: 1px solid var(--line);
      padding-top: 40px;
      font-family: var(--body);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.68;
      color: var(--fg);
      text-wrap: pretty;
    }

    article>*:first-child {
      margin-top: 0;
    }

    article h2 {
      font-family: var(--heading);
      font-size: 20.5px;
      font-weight: 700;
      letter-spacing: -.003em;
      line-height: 1.4;
      margin: 42px 0 14px;
      text-wrap: balance;
    }

    article h3 {
      font-family: var(--heading);
      font-size: 17.5px;
      font-weight: 600;
      color: var(--fg);
      margin: 30px 0 10px;
      text-wrap: balance;
    }

    article p {
      margin: 0 0 22px;
    }

    article ul,
    article ol {
      margin: 0 0 22px;
      padding-left: 24px;
    }

    /* Tighter leading *within* an item so wrapped lines read as one thought,
       and a clearly bigger gap *between* items so each bullet reads as its
       own thing. Without this contrast, wrapped lines and separate items
       end up looking the same distance apart. */
    article li {
      line-height: 1.55;
      margin-bottom: 12px;
      padding-left: 2px;
    }

    article li:last-child {
      margin-bottom: 0;
    }

    article li>ul,
    article li>ol {
      margin: 10px 0 0;
    }

    article li>p {
      margin-bottom: 8px;
    }

    article strong {
      font-weight: 600;
      color: var(--fg);
    }

    article em {
      font-style: italic;
      color: var(--fg);
    }

    article a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: var(--accent-soft);
      text-underline-offset: 3px;
      transition: text-decoration-color .15s ease;
    }

    article a:hover {
      text-decoration-color: var(--accent);
    }

    /* Fira Code — a touch wider per character than most mono faces, so
       it runs slightly smaller here than a JetBrains/IBM Plex Mono
       setting would, to land at the same visual size next to the body copy. */
    article code {
      background: var(--accent-soft);
      color: var(--fg);
      padding: 2.5px 6px;
      border-radius: 5px;
      font-family: var(--mono);
      font-size: 0.82em;
      font-weight: 500;
    }

    /* Wrapper around each <pre> purely so the copy button can sit fixed
       in the corner without scrolling away with the code underneath it —
       the button lives outside the scrollable element, not inside it. */
    .code-block {
      position: relative;
      margin: 6px 0 26px;
    }

    .code-block pre {
      margin: 0;
    }

    .code-copy-btn {
      position: absolute;
      /* top: 10px;
      right: 10px; */
      top: 4px;
      right: 4px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--faint);
      cursor: pointer;
      opacity: .55;
      transition: opacity .15s ease, color .15s ease, border-color .15s ease, background .15s ease;
    }

    .code-block:hover .code-copy-btn,
    .code-copy-btn:hover,
    .code-copy-btn:focus-visible {
      opacity: 1;
    }

    .code-copy-btn:hover {
      color: var(--fg);
      border-color: var(--fainter);
    }

    .code-copy-btn.copied {
      opacity: 1;
      color: #2fa860;
      border-color: #2fa860;
    }

    .code-copy-btn svg {
      width: 14px;
      height: 14px;
    }

    /* ---------- Minimal scrollbars ----------
       A hairline thumb on transparent track for both code blocks and wide
       tables, instead of the OS default scrollbar. Firefox via
       scrollbar-width/scrollbar-color, everything else via the
       ::-webkit-scrollbar pseudo-elements. */
    article pre,
    .table-wrap {
      scrollbar-width: thin;
      scrollbar-color: var(--fainter) transparent;
    }

    article pre::-webkit-scrollbar,
    .table-wrap::-webkit-scrollbar {
      height: 5px;
      width: 5px;
    }

    article pre::-webkit-scrollbar-track,
    .table-wrap::-webkit-scrollbar-track {
      background: transparent;
    }

    article pre::-webkit-scrollbar-thumb,
    .table-wrap::-webkit-scrollbar-thumb {
      background: var(--fainter);
      border-radius: 10px;
    }

    article pre::-webkit-scrollbar-thumb:hover,
    .table-wrap::-webkit-scrollbar-thumb:hover {
      background: var(--faint);
    }

    article pre {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      /* padding: 44px 20px 18px; */
      padding:18px 20px 8px;      
      overflow-x: auto;
      margin: 6px 0 26px;
    }

    article pre code {
      background: none;
      padding: 0;
      font-weight: 400;
      font-size: 13.5px;
      line-height: 1.6;
    }

    /* ---------- Tables ----------
       Wrapped in .table-wrap by JS so wide tables scroll horizontally on
       small screens instead of squeezing columns or breaking layout. */
    .table-wrap {
      overflow-x: auto;
      margin: 0 0 26px;
      -webkit-overflow-scrolling: touch;
    }

    article table {
      width: 100%;
      min-width: 420px;
      border-collapse: collapse;
      font-size: 0.92em;
    }

    article th,
    article td {
      text-align: left;
      padding: 9px 14px;
      border-bottom: 1px solid var(--line);
      white-space: normal;
    }

    article th:first-child,
    article td:first-child {
      padding-left: 0;
    }

    article th:last-child,
    article td:last-child {
      padding-right: 0;
    }

    article thead th {
      font-weight: 600;
      color: var(--fg);
      border-bottom: 2px solid var(--line);
    }

    article tbody td {
      color: var(--muted);
    }

    article tbody tr:last-child td {
      border-bottom: none;
    }

    article tbody code {
      color: var(--fg);
    }

    article blockquote {
      margin: 0 0 24px;
      padding-left: 18px;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }

    article blockquote p {
      margin-bottom: 8px;
    }

    article blockquote p:last-child {
      margin-bottom: 0;
    }

    article hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 40px 0;
    }

    /* ---------- Images / future illustrations ---------- */
    article img {
      max-width: 100%;
      display: block;
      border-radius: 10px;
      border: 1px solid var(--line);
      margin: 8px 0 8px;
    }

    article figure {
      margin: 12px 0 30px;
    }

    article figure img {
      margin-bottom: 10px;
    }

    article figcaption,
    article .caption {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .01em;
      text-align: center;
      line-height: 1.5;
    }

    /* ---------- Muting hierarchy ----------
       fg      = body copy, the thing being read
       muted   = supporting text (desc, blockquotes)
       faint   = metadata (dates, captions)
       fainter = decorative / least important (hr, dividers already use --line) */

    .state-msg {
      color: var(--muted);
      padding: 40px 0;
    }

    @media (max-width: 480px) {
      .wrap {
        padding: 40px 20px 100px;
      }

      h1.post-title {
        font-size: 25px;
        line-height: 1.32;
      }

      .post-desc {
        font-size: 15px;
        margin-bottom: 36px;
      }

      article {
        font-size: 15.5px;
        line-height: 1.72;
      }

      article h2 {
        font-size: 18.5px;
        margin: 34px 0 10px;
      }

      article h3 {
        font-size: 16.5px;
      }

      article table {
        min-width: 340px;
      }
    }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <div class="wrap">
    <div class="top-row">
      <a class="back-link" href="index.html#blog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Back to blog
      </a>
      <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
      </button>
    </div>

    <div id="post-header"></div>
    <article id="post-body">
      <p class="state-msg">Loading…</p>
    </article>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="blog-posts.js"></script>
  <script>
    /* ---------- Theme toggle ---------- */
    var root = document.documentElement;
    var themeBtn = document.getElementById('theme-toggle');
    themeBtn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) { }
    });

    /* ---------- Render ----------
       Title, date, and description all come from the post's own
       frontmatter (see blog-posts.js) — nothing post-specific is
       hardcoded on this page. A slug not in posts-manifest.json, or a
       file that fails to load, falls through to the not-found state. */
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('post');
    const headerEl = document.getElementById('post-header');
    const bodyEl = document.getElementById('post-body');

    function showNotFound() {
      headerEl.innerHTML = '<h1 class="post-title">Post not found</h1>';
      bodyEl.innerHTML = '<p class="state-msg">Couldn\'t find that post. <a href="index.html#blog">Back to the blog list</a>.</p>';
    }

    if (!slug) {
      showNotFound();
    } else {
      loadPostBySlug(slug)
        .then(post => {
          headerEl.innerHTML = `
        <div class="post-date">${new Date(post.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
        <h1 class="post-title">${post.title}</h1>
        <div class="post-desc">${post.description}</div>
      `;
          document.title = 'Blog | ' + post.title;
          bodyEl.innerHTML = marked.parse(post.content);
          // Wrap tables so wide ones scroll horizontally instead of
          // breaking the mobile layout.
          bodyEl.querySelectorAll('table').forEach(function (table) {
            const wrap = document.createElement('div');
            wrap.className = 'table-wrap';
            table.parentNode.insertBefore(wrap, table);
            wrap.appendChild(table);
          });
          addCodeCopyButtons(bodyEl);
          openExternalLinksInNewTab(bodyEl);
        })
        .catch(() => {
          showNotFound();
        });
    }

    /* ---------- Copy button on code blocks ----------
       Wraps each <pre> in a positioning container, then drops a button in
       the corner that copies the code's raw text (via textContent, so no
       HTML tags leak in) and morphs its icon to a checkmark for a second
       as confirmation before reverting. */
    const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

    function addCodeCopyButtons(container) {
      container.querySelectorAll('pre').forEach(function (pre) {
        const code = pre.querySelector('code');
        if (!code) return;

        const wrap = document.createElement('div');
        wrap.className = 'code-block';
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'code-copy-btn';
        btn.setAttribute('aria-label', 'Copy code');
        btn.innerHTML = COPY_ICON;

        let revertTimer = null;
        btn.addEventListener('click', function () {
          navigator.clipboard.writeText(code.textContent).then(function () {
            clearTimeout(revertTimer);
            btn.innerHTML = CHECK_ICON;
            btn.classList.add('copied');
            btn.setAttribute('aria-label', 'Copied');
            revertTimer = setTimeout(function () {
              btn.innerHTML = COPY_ICON;
              btn.classList.remove('copied');
              btn.setAttribute('aria-label', 'Copy code');
            }, 1000);
          }).catch(function () { /* clipboard unavailable — fail silently */ });
        });

        wrap.appendChild(btn);
      });
    }

    /* ---------- External links open in a new tab ----------
       Anything absolute (http/https) in the markdown is by definition
       leaving the site, so it gets target=_blank + rel=noopener. Relative
       links (back to index.html, other posts, in-page anchors) stay in
       the same tab. */
    function openExternalLinksInNewTab(container) {
      container.querySelectorAll('a[href]').forEach(function (a) {
        if (/^https?:\/\//i.test(a.getAttribute('href'))) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
      });
    }
  </script>
</body>

</html>
